app:
  name: datechat-api
  env: prod
  addr: ":8080"
  version: "0.1.0"
  shutdown_timeout: 20s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s

log:
  level: info
  format: json

mysql:
  host: "${MYSQL_HOST}"
  port: 3306
  user: "${MYSQL_USER}"
  password: "${MYSQL_PASSWORD}"
  database: "${MYSQL_DATABASE}"
  charset: utf8mb4
  parse_time: true
  max_open_conns: 200
  max_idle_conns: 50
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  slow_threshold: 100ms

redis:
  addrs:
    - "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 200
  dial_timeout: 3s
  read_timeout: 3s
  write_timeout: 3s

jwt:
  secret: "${JWT_SECRET}"
  issuer: datechat
  access_ttl: 2h
  refresh_ttl: 720h

rate_limit:
  enabled: true
  rps: 200
  burst: 400
  ttl: 10m

cors:
  allow_origins:
    - "https://app.datechat.example"
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
    - X-Request-Id
    - X-Platform
    - X-App-Version
  expose_headers:
    - X-Request-Id
  max_age: 12h

# 生产密钥一律由环境变量注入，禁止写入仓库。
# security.data_key 建议 32 字节随机串；轮换时需保留旧密钥做双读解密迁移。
security:
  data_key: "${SECURITY_DATA_KEY}"
  hmac_key: "${SECURITY_HMAC_KEY}"

sms:
  provider: tencent
  code_length: 6
  code_ttl: 5m
  resend_interval: 60s
  daily_limit: 10
  max_verify_attempts: 5
  expose_code_in_dev: false
  tencent:
    secret_id: "${TENCENT_SMS_SECRET_ID}"
    secret_key: "${TENCENT_SMS_SECRET_KEY}"
    sdk_app_id: "${TENCENT_SMS_SDK_APP_ID}"
    sign_name: "${TENCENT_SMS_SIGN_NAME}"
    template_id: "${TENCENT_SMS_TEMPLATE_ID}"
    region: ap-guangzhou

im:
  sdk_app_id: ${TENCENT_IM_SDK_APP_ID}
  secret_key: "${TENCENT_IM_SECRET_KEY}"
  admin_user_id: administrator
  usersig_expire: 168h
  import_enabled: true     # 生产必须开启：登录时把账号导入 IM
  local_fallback: false    # 生产禁止回落：IM 失败要暴露而不是静默丢消息
  endpoint: "https://console.tim.qq.com"
  callback_token: "${TENCENT_IM_CALLBACK_TOKEN}" # 腾讯云控制台"回调配置"里填的 Token，用于 sha256(Token+RequestTime) 验签
  callback_max_skew: 2m    # 回调时间戳允许偏移，防重放
  message_max_chars: 500
  recall_window: 2m

# 上传：生产必须走 COS。local 通道只在单实例自测下成立，
# 多副本部署时 A 实例写盘的文件 B 实例读不到，头像会 404。
upload:
  provider: cos
  max_image_mb: 5
  cos:
    secret_id: "${TENCENT_COS_SECRET_ID}"
    secret_key: "${TENCENT_COS_SECRET_KEY}"
    region: "${TENCENT_COS_REGION}"
    bucket: "${TENCENT_COS_BUCKET}"
    prefix: "upload/"
    host: "https://${TENCENT_COS_BUCKET}.cos.${TENCENT_COS_REGION}.myqcloud.com"
    cdn_domain: "${TENCENT_COS_CDN_DOMAIN}"
    sign_expire: 30m

realname:
  provider: tencent
  enabled: true
  tencent:
    secret_id: "${TENCENT_FACEID_SECRET_ID}"
    secret_key: "${TENCENT_FACEID_SECRET_KEY}"
    region: ap-guangzhou
    rule_id: "${TENCENT_FACEID_RULE_ID}"
    endpoint: "https://faceid.tencentcloudapi.com"
    redirect_url: "${REALNAME_REDIRECT_URL}"

# P4：内容安全。生产建议开启云审核作为第二道防线。
moderation:
  dfa_enabled: true
  cloud_enabled: true
  cloud_on_unknown: true     # 本地没拦住的也送云，牺牲一点延迟换召回率
  cloud_fail_open: false     # 生产更保守：云不可用时转人工而不是直接放行
  tencent:
    secret_id: "${TENCENT_TMS_SECRET_ID}"
    secret_key: "${TENCENT_TMS_SECRET_KEY}"
    region: ap-guangzhou
    biz_type: "${TENCENT_TMS_BIZ_TYPE}"
    endpoint: "tms.tencentcloudapi.com"
    timeout: 3s
  report:
    daily_limit: 20
    reason_required: false

admin:
  enabled: true
  token_ttl: 8h
  bootstrap_user: "${ADMIN_BOOTSTRAP_USER}"
  bootstrap_pwd: "${ADMIN_BOOTSTRAP_PASSWORD}"

# P5：支付。生产必须配真实商户密钥，且禁止模拟支付。
pay:
  order_expire_min: 30
  max_notify_retry: 10
  reconcile_hours: 24
  mock_enabled: false
  wechat:
    enabled: true
    app_id: "${WECHAT_PAY_APP_ID}"
    mch_id: "${WECHAT_PAY_MCH_ID}"
    serial_no: "${WECHAT_PAY_SERIAL_NO}"
    private_key: "${WECHAT_PAY_PRIVATE_KEY}"
    api_v3_key: "${WECHAT_PAY_API_V3_KEY}"
    notify_url: "${WECHAT_PAY_NOTIFY_URL}"
    pay_scene: app

# P6：实时音视频。生产必须配真实 TRTC 凭据，且禁止本地模拟房间。
trtc:
  sdk_app_id: ${TENCENT_TRTC_SDK_APP_ID}
  secret_key: "${TENCENT_TRTC_SECRET_KEY}"
  usersig_expire: 24h
  mock_enabled: false

# P6：通话与计费。
call:
  ring_timeout_sec: 45
  heartbeat_interval_sec: 10
  heartbeat_timeout_sec: 30
  max_duration_sec: 3600
  sweep_interval_sec: 15
  min_coins_to_call: 10

# P7：附近的人与在线。
nearby:
  default_radius_km: 50
  max_radius_km: 200
  page_size: 20
  distance_fuzzy: true
  online_ttl_sec: 120
  min_report_interval_sec: 30

# P8：可观测。生产必须设 metrics_token，且 /metrics 只应在内网开放。
observe:
  metrics_enabled: true
  metrics_token: "${METRICS_TOKEN}"
  slow_request: 1s

# P8：合规开关。
compliance:
  min_age: 18
  realname_required_for_call: true
  realname_required_for_cash: true
  max_recharge_fen_per_day: 200000
  retention_days: 180
