name: datechat
description: 陌生人语音视频社交 App（Flutter 客户端）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 状态管理：Riverpod 2，编译期安全、无 BuildContext 依赖
  flutter_riverpod: ^2.6.1
  # 路由：声明式路由 + 底部导航状态保持
  go_router: ^14.6.2
  # 网络
  dio: ^5.7.0
  # 本地存储（令牌、设备 ID）
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  # 腾讯云原生长连接：登录后即时接收消息，替代仅靠 10 秒轮询。
  tencent_cloud_chat_sdk: ^9.1.7822
  # 腾讯云实时音视频：使用服务端下发的 SDKAppID / UserSig 进入 TRTC 房间。
  tencent_rtc_sdk: ^13.5.2
  # Android 相机、麦克风与通知运行时授权。
  permission_handler: 12.0.1
  # 前台/后台收到 IM 消息时显示安卓系统通知。
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
